  filterBar.appendChild(el('span', { className: 'filter-count', textContent: `${skills.length} skill${skills.length !== 1 ? 's' : ''}` }));
  wrap.appendChild(filterBar);

  // Bulk actions bar
  if (State.bulkMode && State.selectedSkills.size > 0) {
    const bulkBar = el('div', { className: 'bulk-bar' });
    bulkBar.innerHTML = `<span class="count">${State.selectedSkills.size} selected</span>`;
    const delBtn = el('button', { className: 'btn btn-danger btn-sm', onClick: async () => {
      if (!confirm(`Delete ${State.selectedSkills.size} skills?`)) return;
      for (const name of State.selectedSkills) {
        const s = State.skills.find(sk => sk.dirName === name);
        if (s) await deleteSkill(s);
      }
      State.selectedSkills.clear(); State.bulkMode = false; renderContent();
    } });
    delBtn.textContent = 'Delete';
    const expBtn = el('button', { className: 'btn btn-secondary btn-sm', onClick: () => {
      const enc = new TextEncoder();
      const files = [];
      for (const name of State.selectedSkills) {
        const s = State.skills.find(sk => sk.dirName === name);
        if (s) files.push({ name: `${s.dirName}/SKILL.md`, data: enc.encode(s.rawContent) });
      }
      const zip = ZIP.create(files);
      downloadBlob(new Blob([zip], { type: 'application/zip' }), 'skills-selection.zip');
      toast('Exported selected skills');
    } });
    expBtn.textContent = 'Export';
    bulkBar.append(delBtn, expBtn);
    wrap.appendChild(bulkBar);
  }

  // Card grid (with batch rendering for 200+)
  const grid = el('div', { className: `card-grid ${State.bulkMode ? 'bulk-mode' : ''}` });
  const renderBatch = (startIdx) => {
    const batchSize = 50;
    const end = Math.min(startIdx + batchSize, skills.length);
    for (let i = startIdx; i < end; i++) {
      grid.appendChild(renderSkillCard(skills[i]));
    }
    if (end < skills.length) {
      requestAnimationFrame(() => renderBatch(end));
    }
  };
  renderBatch(0);
  wrap.appendChild(grid);
  return wrap;
}

function renderSkillCard(skill) {
  const card = el('div', {
    className: `skill-card${State.selectedSkills.has(skill.dirName) ? ' selected' : ''}`,
    onClick: (e) => {
      if (State.bulkMode) {
        if (State.selectedSkills.has(skill.dirName)) State.selectedSkills.delete(skill.dirName);
        else State.selectedSkills.add(skill.dirName);
        renderContent();
      } else {
        openDetailPanel(skill);
      }
    },
    role: 'button',
    tabindex: '0',
    'aria-label': `Skill: ${skill.frontmatter.name || skill.dirName}`,
    onKeydown: (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    },
  });

  // Checkbox for bulk mode
  const checkbox = el('div', {
    className: `card-checkbox${State.selectedSkills.has(skill.dirName) ? ' checked' : ''}`,
  });
  card.appendChild(checkbox);

  // Validation status dot
  const status = getValidationStatus(skill.validation);
  card.appendChild(el('div', { className: `card-status ${status}`, title: status }));

  // Header
  const header = el('div', { className: 'card-header' });
  const iconDiv = el('div', { className: 'card-icon', textContent: (skill.frontmatter.name || skill.dirName).charAt(0).toUpperCase() });
  const titleDiv = el('div');
  titleDiv.appendChild(el('div', { className: 'card-title', textContent: skill.frontmatter.name || skill.dirName }));
  const diff = skill.frontmatter.metadata?.difficulty;
  if (diff) {
    const diffColors = { beginner: '#22c55e', intermediate: '#f59e0b', advanced: '#ef4444' };
    const badge = el('span', { textContent: diff.toUpperCase(),
      style: { fontSize: '10px', padding: '1px 6px', borderRadius: '3px', fontWeight: '600', letterSpacing: '.5px', textTransform: 'uppercase', color: '#fff', background: diffColors[diff] || 'var(--text-muted)', marginLeft: '6px', display: 'inline-block' }
    });
    titleDiv.firstChild.appendChild(document.createTextNode(' '));
    titleDiv.firstChild.appendChild(badge);
  }
  header.append(iconDiv, titleDiv);
  card.appendChild(header);

  // Description
  card.appendChild(el('div', { className: 'card-desc', textContent: skill.frontmatter.description || 'No description' }));

  // Meta row
  const meta = el('div', { className: 'card-meta' });

  // Quality score
  const score = skill.scores?.overall || 0;
  const scoreClass = score >= 70 ? 'high' : score >= 40 ? 'medium' : 'low';
  meta.appendChild(el('span', { className: `quality-score ${scoreClass}`, textContent: score + '/100' }));

  // Line count
  meta.appendChild(el('span', { textContent: skill.lineCount + ' lines' }));

  // Last modified
  if (skill.lastModified) {
    meta.appendChild(el('span', { textContent: timeAgo(skill.lastModified) }));
  }

  // Supporting files badge
  if (skill.files && skill.files.some(f => f.kind === 'directory' && ['scripts', 'references', 'assets'].includes(f.name))) {
    const sfBadge = el('span', {
      style: { fontSize: '10px', fontWeight: '600', padding: '1px 6px', borderRadius: '3px', textTransform: 'uppercase', letterSpacing: '.5px', background: 'var(--accent-light)', color: 'var(--accent)' },
      title: 'Has supporting files (scripts, references, or assets)',
    });
    sfBadge.innerHTML = icon('folder', 10) + ' Files';
    meta.appendChild(sfBadge);
  }

  // Agent icons
  const badges = el('span', { className: 'agent-badges' });
  const compat = skill.frontmatter.metadata?.agent_compatibility || skill.frontmatter.agent_compatibility;
  if (compat && Array.isArray(compat) && compat.length > 0) {
    compat.forEach(agentId => { badges.innerHTML += agentIcon(agentId, 20); });
  } else {
    badges.innerHTML = agentIcon('universal', 20);
    badges.appendChild(el('span', { textContent: 'All agents', style: { fontSize: '10px', color: 'var(--text-muted)' } }));
  }
  meta.appendChild(badges);

  card.appendChild(meta);
  return card;
}

// ─── Detail Panel (F-06) ─────────────────────────────────────────
let panelTab = 'preview';
function openDetailPanel(skill) {
  State.currentSkill = skill;
  panelTab = 'preview';
  // Track recently used
  State.recentlyUsed = [skill.dirName, ...State.recentlyUsed.filter(n => n !== skill.dirName)].slice(0, 10);
  localStorage.setItem('sf-recent', JSON.stringify(State.recentlyUsed));
  renderPanel();
}

function renderPanel() {
  const skill = State.currentSkill;
  if (!skill) return;
  // Remove existing
  $$('.panel-overlay, .slide-panel').forEach(el => el.remove());

  const overlay = el('div', { className: 'panel-overlay open', onClick: closePanel });
  document.body.appendChild(overlay);

  const panel = el('div', { className: 'slide-panel open', role: 'dialog', 'aria-label': 'Skill details: ' + (skill.frontmatter.name || skill.dirName) });

  // Header
  const header = el('div', { className: 'panel-header' });
  header.appendChild(el('h2', { textContent: skill.frontmatter.name || skill.dirName }));
  const closeBtn = el('button', { className: 'topbar-btn', onClick: closePanel, 'aria-label': 'Close panel' });
  closeBtn.innerHTML = ICONS.x;
  header.appendChild(closeBtn);
  panel.appendChild(header);

  // Tabs
  const tabs = el('div', { className: 'panel-tabs', role: 'tablist', 'aria-label': 'Skill detail tabs' });
  ['preview', 'source', 'files', 'quality', 'history', 'agents'].forEach(t => {
    const tab = el('button', { className: `panel-tab${panelTab === t ? ' active' : ''}`,
      textContent: t.charAt(0).toUpperCase() + t.slice(1),
      role: 'tab',
      'aria-selected': panelTab === t ? 'true' : 'false',
      'aria-label': t.charAt(0).toUpperCase() + t.slice(1) + ' tab',
      onClick: () => { panelTab = t; renderPanel(); }
    });
    tabs.appendChild(tab);
  });
  panel.appendChild(tabs);

  // Body
  const body = el('div', { className: 'panel-body' });
  switch (panelTab) {
    case 'preview':
      body.innerHTML = `<div class="preview-pane">${MD.render(skill.body)}</div>`;
      break;
    case 'source':
      const pre = el('pre', { style: { background: 'var(--bg-alt)', padding: '16px', borderRadius: 'var(--radius)', fontSize: '13px', fontFamily: 'var(--mono)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' } });
      pre.textContent = skill.rawContent;
      body.appendChild(pre);
      break;
    case 'files':
      body.appendChild(renderFilesPanel(skill));
      break;
    case 'quality':
      body.appendChild(renderQualityPanel(skill));
      break;
    case 'history':
      renderHistoryPanel(skill, body);
      break;
    case 'agents':
      body.appendChild(renderAgentsPanel(skill));
      break;
  }
  panel.appendChild(body);

  // Actions
  const actions = el('div', { className: 'panel-actions' });
  const editBtn = el('button', { className: 'btn btn-primary btn-sm', onClick: () => { closePanel(); State.view = 'editor'; State.currentSkill = skill; render(); } });
  editBtn.innerHTML = `${icon('edit', 14)} Edit`;
  const dupBtn = el('button', { className: 'btn btn-secondary btn-sm', onClick: async () => { await duplicateSkill(skill); closePanel(); await loadSkills(); render(); } });
  dupBtn.textContent = 'Duplicate';
  const expBtn = el('button', { className: 'btn btn-secondary btn-sm', onClick: () => exportSkillZip(skill) });
  expBtn.innerHTML = `${icon('download', 14)} Export`;
  const copyBtn = el('button', { className: 'btn btn-secondary btn-sm', onClick: () => copyToClipboard(skill.rawContent) });
  copyBtn.innerHTML = `${icon('copy', 14)} Copy`;
  const delBtn = el('button', { className: 'btn btn-danger btn-sm', onClick: async () => {
    if (!confirm('Delete ' + skill.dirName + '?')) return;
    await deleteSkill(skill); closePanel(); render();
  } });
  delBtn.innerHTML = `${icon('trash', 14)} Delete`;
  actions.append(editBtn, dupBtn, expBtn, copyBtn, delBtn);
  panel.appendChild(actions);

  document.body.appendChild(panel);
  // Focus close button for accessibility
  requestAnimationFrame(() => { const btn = panel.querySelector('[aria-label="Close panel"]'); if (btn) btn.focus(); });
}

function closePanel() {
  $$('.panel-overlay, .slide-panel').forEach(el => el.remove());
  State.currentSkill = null;
}

// ─── Supporting Files Helpers ─────────────────────────────────────
const SUBDIRS = ['scripts', 'references', 'assets'];

function categorizeFiles(files) {
  const groups = { scripts: [], references: [], assets: [], other: [] };
  files.forEach(f => {
    if (f.name === 'SKILL.md') return;
    if (f.kind === 'directory' && SUBDIRS.includes(f.name)) return;
    let placed = false;
    // Check if file path starts with a known subdir (from deep scan)
    if (f.subdir && groups[f.subdir]) { groups[f.subdir].push(f); placed = true; }
    if (!placed) groups.other.push(f);
  });
  return groups;
}

function getSupportingFileCount(skill) {
  if (!skill.files) return 0;
  let count = 0;
  skill.files.forEach(f => {
    if (f.kind === 'directory' && SUBDIRS.includes(f.name)) count++;
    if (f.subdir && SUBDIRS.includes(f.subdir)) count++;
  });
  return count;
}

function hasSupportingFiles(skill) {
  if (!skill.files) return false;
  return skill.files.some(f =>
    (f.kind === 'directory' && SUBDIRS.includes(f.name)) ||
    (f.subdir && SUBDIRS.includes(f.subdir))
  );
}

async function scanSubdirectories(skill) {
  const result = [];
  for (const subdir of SUBDIRS) {
    try {
      const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: false });
      for await (const entry of dirHandle.values()) {
        if (entry.kind === 'file') {
          try {
            const file = await entry.getFile();
            result.push({ name: entry.name, kind: 'file', subdir, size: file.size });
          } catch (e) {
            result.push({ name: entry.name, kind: 'file', subdir });
          }
        }
      }
    } catch (e) { /* subdir doesn't exist */ }
  }
  return result;
}

async function readSupportingFile(skill, subdir, filename) {
  try {
    const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: false });
    const fileHandle = await dirHandle.getFileHandle(filename);
    const file = await fileHandle.getFile();
    return await file.text();
  } catch (e) { return null; }
}

async function writeSupportingFile(skill, subdir, filename, content) {
  try {
    const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: true });
    const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(content);
    await writable.close();
    toast('File saved: ' + subdir + '/' + filename);
    return true;
  } catch (e) { toast('Failed to save file: ' + e.message, 'error'); return false; }
}

async function deleteSupportingFile(skill, subdir, filename) {
  try {
    const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: false });
    await dirHandle.removeEntry(filename);
    toast('Deleted: ' + subdir + '/' + filename);
    return true;
  } catch (e) { toast('Delete failed: ' + e.message, 'error'); return false; }
}

function formatFileSize(bytes) {
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function renderFilesPanel(skill) {
  const wrap = el('div');

  // Total count badge
  const totalFiles = skill.files.filter(f => f.name !== 'SKILL.md').length;
  const headerRow = el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '16px' } });
  headerRow.appendChild(el('h3', { textContent: 'Skill Files', style: { fontSize: '16px', flex: '1' } }));
  headerRow.appendChild(el('span', { className: 'nav-badge', textContent: String(totalFiles), title: totalFiles + ' files' }));
  wrap.appendChild(headerRow);

  // SKILL.md entry
  const skillMdItem = el('div', { style: { padding: '10px 12px', border: '1px solid var(--border)', borderRadius: 'var(--radius)', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px', fontSize: '14px' } });
  skillMdItem.innerHTML = icon('edit', 14);
  skillMdItem.appendChild(el('span', { textContent: ' SKILL.md', style: { fontWeight: '600', flex: '1' } }));
  skillMdItem.appendChild(el('span', { textContent: 'Primary skill file', style: { fontSize: '12px', color: 'var(--text-muted)' } }));
  wrap.appendChild(skillMdItem);

  // Subdirectory groups
  SUBDIRS.forEach(subdir => {
    const section = el('div', { style: { marginBottom: '16px' } });
    const sectionHeader = el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' } });
    sectionHeader.innerHTML = icon('folder', 14);
    sectionHeader.appendChild(el('span', { textContent: ' ' + subdir + '/', style: { fontWeight: '600', fontSize: '14px', flex: '1' } }));

    // Create file button
    const createBtn = el('button', { className: 'btn btn-ghost btn-sm', title: 'New file in ' + subdir, 'aria-label': 'Create new file in ' + subdir,
      onClick: () => {
        showCreateFileForm(skill, subdir, wrap);
      }
    });
    createBtn.innerHTML = icon('plus', 14);
    sectionHeader.appendChild(createBtn);
    section.appendChild(sectionHeader);

    // Scan and display files in this subdir
    const filesContainer = el('div', { className: 'files-list-' + subdir });
    filesContainer.appendChild(el('span', { textContent: 'Loading...', style: { fontSize: '12px', color: 'var(--text-muted)' } }));
    section.appendChild(filesContainer);

    // Async scan
    (async () => {
      try {
        const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: false });
        const files = [];
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            try { const f = await entry.getFile(); files.push({ name: entry.name, size: f.size }); }
            catch (e) { files.push({ name: entry.name }); }
          }
        }
        filesContainer.innerHTML = '';
        if (files.length === 0) {
          filesContainer.appendChild(el('span', { textContent: 'Empty directory', style: { fontSize: '12px', color: 'var(--text-muted)', paddingLeft: '26px' } }));
        } else {
          files.sort((a, b) => a.name.localeCompare(b.name));
          files.forEach(f => {
            const item = el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 12px 6px 26px', borderBottom: '1px solid var(--border)', fontSize: '13px' } });
            item.appendChild(el('span', { textContent: f.name, style: { flex: '1', fontFamily: 'var(--mono)', fontSize: '12px' } }));
            if (f.size != null) item.appendChild(el('span', { textContent: formatFileSize(f.size), style: { fontSize: '11px', color: 'var(--text-muted)' } }));
            // View button
            const viewBtn = el('button', { className: 'btn btn-ghost btn-sm', title: 'View file', 'aria-label': 'View ' + f.name,
              onClick: async (e) => { e.stopPropagation(); await showFileViewer(skill, subdir, f.name, wrap); }
            });
            viewBtn.innerHTML = icon('edit', 12);
            item.appendChild(viewBtn);
            // Delete button
            const delBtn = el('button', { className: 'btn btn-ghost btn-sm', title: 'Delete file', 'aria-label': 'Delete ' + f.name,
              onClick: async (e) => {
                e.stopPropagation();
                if (!confirm('Delete ' + subdir + '/' + f.name + '?')) return;
                if (await deleteSupportingFile(skill, subdir, f.name)) { renderPanel(); }
              }
            });
            delBtn.innerHTML = icon('trash', 12);
            item.appendChild(delBtn);
            filesContainer.appendChild(item);
          });
        }
      } catch (e) {
        filesContainer.innerHTML = '';
        const createDirBtn = el('button', { className: 'btn btn-ghost btn-sm', style: { fontSize: '12px' },
          onClick: async () => {
            try {
              await skill.dirHandle.getDirectoryHandle(subdir, { create: true });
              toast('Created ' + subdir + '/ directory');
              renderPanel();
            } catch (err) { toast('Failed to create directory: ' + err.message, 'error'); }
          }
        });
        createDirBtn.innerHTML = icon('folder', 12) + ' Create ' + subdir + '/ folder';
        filesContainer.appendChild(createDirBtn);
      }
    })();

    wrap.appendChild(section);
  });

  // Other files
  const otherFiles = skill.files.filter(f => f.name !== 'SKILL.md' && !(f.kind === 'directory' && SUBDIRS.includes(f.name)));
  if (otherFiles.length > 0) {
    const section = el('div', { style: { marginBottom: '16px' } });
    section.appendChild(el('div', { textContent: 'Other Files', style: { fontWeight: '600', fontSize: '14px', marginBottom: '8px' } }));
    otherFiles.forEach(f => {
      const item = el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 12px', borderBottom: '1px solid var(--border)', fontSize: '13px' } });
      item.innerHTML = f.kind === 'directory' ? icon('folder', 14) : icon('edit', 14);
      item.appendChild(el('span', { textContent: ' ' + f.name, style: { flex: '1' } }));
      section.appendChild(item);
    });
    wrap.appendChild(section);
  }

  return wrap;
}

function showCreateFileForm(skill, subdir, container) {
  // Remove any existing create form
  const existing = container.querySelector('.create-file-form');
  if (existing) existing.remove();

  const form = el('div', { className: 'create-file-form', style: { border: '1px solid var(--accent)', borderRadius: 'var(--radius)', padding: '16px', marginBottom: '16px', background: 'var(--bg-alt)' } });
  form.appendChild(el('h4', { textContent: 'Add files to ' + subdir + '/', style: { fontSize: '14px', marginBottom: '12px' } }));

  // Two-option row: Upload Files + Create Text File
  const optRow = el('div', { style: { display: 'flex', gap: '8px', marginBottom: '12px' } });

  // Hidden file input for uploads
  const fileInput = el('input', { type: 'file', multiple: 'true', style: { display: 'none' } });
  fileInput.addEventListener('change', async () => {
    if (!fileInput.files.length) return;
    try {
      const dirHandle = await skill.dirHandle.getDirectoryHandle(subdir, { create: true });
      for (const file of fileInput.files) {
        const fileHandle = await dirHandle.getFileHandle(file.name, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(file);
        await writable.close();
      }
      toast(`Uploaded ${fileInput.files.length} file(s) to ${subdir}/`);
      await loadSkills();
      const updated = State.skills.find(s => s.dirName === skill.dirName);
      if (updated) State.currentSkill = updated;
      renderPanel();
    } catch (e) { toast('Upload failed: ' + e.message, 'error'); }
  });
  form.appendChild(fileInput);

  const uploadBtn = el('button', { className: 'btn btn-secondary btn-sm',
    onClick: () => fileInput.click()
  });
  uploadBtn.innerHTML = `${icon('upload', 14)} Upload Files`;
  optRow.appendChild(uploadBtn);

  const createTextBtn = el('button', { className: 'btn btn-secondary btn-sm' });
  createTextBtn.innerHTML = `${icon('plus', 14)} Create Text File`;
  optRow.appendChild(createTextBtn);

  const cancelBtn = el('button', { className: 'btn btn-ghost btn-sm', textContent: 'Cancel', onClick: () => form.remove(), style: { marginLeft: 'auto' } });
  optRow.appendChild(cancelBtn);
  form.appendChild(optRow);

  // Text file creation area (hidden initially, shown when "Create Text File" clicked)
  const textArea = el('div', { style: { display: 'none' } });
  const nameInput = el('input', { className: 'form-input', type: 'text', placeholder: 'filename.md', style: { marginBottom: '8px' }, 'aria-label': 'New file name' });
  textArea.appendChild(nameInput);
  const contentArea = el('textarea', { className: 'form-textarea', placeholder: 'File contents...', style: { minHeight: '100px', fontFamily: 'var(--mono)', fontSize: '13px', marginBottom: '8px' }, 'aria-label': 'New file content' });
  textArea.appendChild(contentArea);
  const saveBtnRow = el('div', { style: { display: 'flex', gap: '8px' } });
  saveBtnRow.appendChild(el('button', { className: 'btn btn-primary btn-sm', textContent: 'Create File',
    onClick: async () => {
      const name = nameInput.value.trim();
      if (!name) { toast('Enter a filename', 'error'); return; }
      if (/[/\\]|\.\./.test(name)) { toast('Invalid filename', 'error'); return; }
      if (await writeSupportingFile(skill, subdir, name, contentArea.value)) {
        await loadSkills();
        const updated = State.skills.find(s => s.dirName === skill.dirName);
        if (updated) State.currentSkill = updated;
        renderPanel();
      }
    }
  }));
  textArea.appendChild(saveBtnRow);
  form.appendChild(textArea);

  createTextBtn.addEventListener('click', () => {
    textArea.style.display = 'block';
    nameInput.focus();
  });

  // Insert at top of body
  container.prepend(form);
}

async function showFileViewer(skill, subdir, filename, container) {
  const content = await readSupportingFile(skill, subdir, filename);
  if (content === null) { toast('Could not read file', 'error'); return; }

  // Remove existing viewer
  const existing = container.querySelector('.file-viewer');
  if (existing) existing.remove();

  const viewer = el('div', { className: 'file-viewer', style: { border: '1px solid var(--accent)', borderRadius: 'var(--radius)', padding: '16px', marginBottom: '16px', background: 'var(--bg-alt)' } });
  const headerRow = el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' } });
  headerRow.appendChild(el('h4', { textContent: subdir + '/' + filename, style: { fontSize: '14px', flex: '1', fontFamily: 'var(--mono)' } }));
  const closeBtn = el('button', { className: 'btn btn-ghost btn-sm', 'aria-label': 'Close viewer', onClick: () => viewer.remove() });
  closeBtn.innerHTML = icon('x', 14);
  headerRow.appendChild(closeBtn);
  viewer.appendChild(headerRow);

  const textarea = el('textarea', { className: 'form-textarea', value: content, style: { minHeight: '200px', fontFamily: 'var(--mono)', fontSize: '13px', marginBottom: '8px' }, 'aria-label': 'File content editor for ' + filename });
  viewer.appendChild(textarea);

  const saveBtn = el('button', { className: 'btn btn-primary btn-sm', textContent: 'Save Changes',

      if (await writeSupportingFile(skill, subdir, filename, textarea.value)) {
        viewer.remove();
      }
    }

  viewer.appendChild(saveBtn);

  container.prepend(viewer);
}

function renderQualityPanel(skill) {
  const wrap = el('div');
  const scores = skill.scores;
  // Overall
  const overall = el('div', { className: 'overall-score' });
  overall.innerHTML = `<div class="big-num">${scores.overall}</div><div class="label">Overall Quality Score</div>`;
  wrap.appendChild(overall);

  // Dimensions
  const dims = el('div', { className: 'score-dimensions', style: { marginTop: '20px' } });
  const dimConfig = {
    structure: { label: 'Structure', tip: 'Add frontmatter with name/description, use organized headings (H1, H2, H3)' },
    instructionQuality: { label: 'Instruction Quality', tip: 'Use imperative language, add numbered steps, include examples and constraints' },
    completeness: { label: 'Completeness', tip: 'Add output format, process/workflow section, error handling, and metadata' },
    tokenEfficiency: { label: 'Token Efficiency', tip: 'Aim for 50-1500 tokens, remove repetition and excessive whitespace' },
    reusability: { label: 'Reusability', tip: 'Use placeholders like {project}, avoid project-specific references, define input/output' },
    clarity: { label: 'Clarity', tip: 'Use short paragraphs, bullet points, code blocks with language tags, and bold key terms' }
  };
  for (const [key, cfg] of Object.entries(dimConfig)) {
    const val = scores[key];
    const cls = val > 80 ? 'high' : val > 60 ? 'medium' : 'low';
    const row = el('div', { className: 'score-dim' });
    row.innerHTML = `<span class="score-dim-label">${esc(cfg.label)}</span><div class="score-bar"><div class="score-bar-fill ${cls}" style="width:${val}%"></div></div><span class="score-value">${val}</span>`;
    if (val < 80) {
      const tip = el('div', { className: 'score-tip', style: { fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px', marginBottom: '6px', paddingLeft: '4px' } });
      tip.textContent = '\u{1F4A1} ' + cfg.tip;
      row.appendChild(tip);
    }
    dims.appendChild(row);
  }
  wrap.appendChild(dims);

  // Validation
  wrap.appendChild(el('h3', { textContent: 'Validation', style: { marginTop: '24px', marginBottom: '12px', fontSize: '16px' } }));
  const vList = el('div', { className: 'validation-list' });
  if (skill.validation.length === 0) {
    const passItem = el('div', { className: 'validation-item pass' });
    passItem.appendChild(el('span', { className: 'validation-icon', textContent: '✓' }));
    passItem.appendChild(document.createTextNode(' All checks passed'));
    vList.appendChild(passItem);
  } else {
    skill.validation.forEach(v => {
      const cls = v.type === 'error' ? 'fail' : 'warn';
      const ic = v.type === 'error' ? '✕' : '⚠';
      const item = el('div', { className: `validation-item ${cls}` });
      item.appendChild(el('span', { className: 'validation-icon', textContent: ic }));
      item.appendChild(document.createTextNode(' ' + v.msg));
      if (v.autoFix === 'slug') {
        const fixBtn = el('button', { className: 'btn btn-sm btn-secondary', textContent: 'Auto-fix', style: { marginLeft: 'auto' },
          onClick: async () => {
            skill.frontmatter.name = slugify(skill.frontmatter.name || skill.dirName);
            const content = serializeSkill(skill.frontmatter, skill.body);
            await saveSkillContent(skill, content);
            renderPanel();
          }
        });
        item.appendChild(fixBtn);
      }
      vList.appendChild(item);
    });
  }
  wrap.appendChild(vList);
  return wrap;
}

async function renderHistoryPanel(skill, body) {
  const history = await loadHistory(skill);
  if (history.length === 0) {
    body.appendChild(el('p', { textContent: 'No version history yet. History is saved each time you edit.', style: { color: 'var(--text-muted)' } }));
    return;
  }
  history.forEach((h, i) => {
    const item = el('div', { className: 'history-item' });
    const date = new Date(h.ts);
    item.appendChild(el('span', { className: 'timestamp', textContent: date.toLocaleString() }));
    item.appendChild(el('span', { className: 'snapshot-info', textContent: h.content.split('\n').length + ' lines' }));
    const restoreBtn = el('button', { className: 'btn btn-sm btn-secondary', textContent: 'Restore',
      onClick: async () => {
        if (!confirm('Restore this version?')) return;
        await saveSkillContent(skill, h.content);
        renderPanel();
        toast('Version restored');
      }
    });
    item.appendChild(restoreBtn);
    body.appendChild(item);
  });
}

// ─── Wizard (F-03) ───────────────────────────────────────────────
function renderWizard() {
  const wrap = el('div', { className: 'wizard slide-up' });
  const steps = ['Name & Purpose', 'Template', 'Instructions', 'Advanced', 'Review'];

  // Step indicators
  const stepsEl = el('div', { className: 'wizard-steps', role: 'navigation', 'aria-label': 'Wizard progress' });
  stepsEl.appendChild(el('div', { className: 'wizard-connector' }));
  steps.forEach((s, i) => {
    const step = el('div', { className: `wizard-step${i === State.wizardStep ? ' active' : ''}${i < State.wizardStep ? ' done' : ''}` });
    step.innerHTML = `<div class="wizard-step-num">${i < State.wizardStep ? '✓' : i + 1}</div><div class="wizard-step-label">${s}</div>`;
    stepsEl.appendChild(step);
  });
  wrap.appendChild(stepsEl);

  // Body
  const body = el('div', { className: 'wizard-body' });
  switch (State.wizardStep) {
    case 0: body.appendChild(renderWizardStep0()); break;
    case 1: body.appendChild(renderWizardStep1()); break;
    case 2: body.appendChild(renderWizardStep2()); break;
    case 3: body.appendChild(renderWizardStep3()); break;
    case 4: body.appendChild(renderWizardStep4()); break;
  }
  wrap.appendChild(body);

  // Footer
  const footer = el('div', { className: 'wizard-footer' });
  if (State.wizardStep > 0) {
    const backBtn = el('button', { className: 'btn btn-secondary', textContent: 'Back', onClick: () => { State.wizardStep--; renderContent(); } });
    footer.appendChild(backBtn);
  } else {
    footer.appendChild(el('div'));
  }
  if (State.wizardStep < 4) {
    const nextBtn = el('button', { className: 'btn btn-primary', textContent: 'Next', onClick: () => {
      if (State.wizardStep === 0 && !State.wizardData.name) { toast('Please enter a skill name', 'error'); return; }
      State.wizardStep++; renderContent();
    } });
    footer.appendChild(nextBtn);
  } else {
    const createBtn = el('button', { className: 'btn btn-primary', textContent: 'Create Skill', onClick: async () => {
      const d = State.wizardData;
      const fm = { name: d.slug || slugify(d.name || 'my-skill'), description: d.description || '' };
      if (d.license) fm.license = d.license;
      if (d.compatibility) fm.compatibility = d.compatibility;
      if (d.allowedTools) fm['allowed-tools'] = d.allowedTools;
      if (d.metadata) fm.metadata = d.metadata;
      const bodyContent = d.instructions || d.templateBody || '# ' + (d.name || 'My Skill') + '\n\nAdd your instructions here.\n';
      const content = serializeSkill(fm, bodyContent);
      const name = fm.name;
      const result = await createSkill(name, content);
      if (result) { await loadSkills(); State.view = 'dashboard'; render(); }
    } });
    footer.appendChild(createBtn);
  }
  wrap.appendChild(footer);
  return wrap;
}

// ─── Editor (F-04) ───────────────────────────────────────────────
function renderEditor() {
  if (!State.currentSkill) { State.view = 'dashboard'; renderContent(); return el('div'); }
  const skill = State.currentSkill;
  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', height: 'calc(100vh - 52px - 48px)', margin: '-24px' } });

  // Toolbar
  const toolbar = el('div', { className: 'editor-toolbar' });
  const insertFm = el('button', { className: 'btn btn-ghost btn-sm', textContent: 'Insert Frontmatter', onClick: () => {
    const ta = wrap.querySelector('textarea.code-editor');
    if (ta && !ta.value.startsWith('---')) {
      ta.value = '---\nname: \ndescription: \n---\n' + ta.value;
      State.editorDirty = true;
      updateEditorStatus(wrap);
    }
  } });
  const insertCode = el('button', { className: 'btn btn-ghost btn-sm', textContent: 'Insert Code Block', onClick: () => {
    const ta = wrap.querySelector('textarea.code-editor');
    if (ta) {
      const pos = ta.selectionStart;
      const before = ta.value.slice(0, pos);
      const after = ta.value.slice(pos);
      ta.value = before + '```\n\n```' + after;
      ta.selectionStart = ta.selectionEnd = pos + 4;
      ta.focus();
      State.editorDirty = true;
      updateEditorStatus(wrap);
    }
  } });
  // Undo/Redo
  State.editorHistory = [skill.rawContent];
  State.editorHistoryIndex = 0;
  let historyDebounce = null;
  function pushHistory(val) {
    clearTimeout(historyDebounce);
    historyDebounce = setTimeout(() => {
      if (State.editorHistory[State.editorHistoryIndex] === val) return;
      State.editorHistory = State.editorHistory.slice(0, State.editorHistoryIndex + 1);
      State.editorHistory.push(val);
      if (State.editorHistory.length > 50) State.editorHistory.shift();
      State.editorHistoryIndex = State.editorHistory.length - 1;
      updateUndoRedoBtns();
    }, 500);
  }
  function editorUndo() {
    if (State.editorHistoryIndex <= 0) return;
    State.editorHistoryIndex--;
    const ta = wrap.querySelector('textarea.code-editor');
    if (ta) { ta.value = State.editorHistory[State.editorHistoryIndex]; State.editorDirty = true; updateEditorStatus(wrap); updatePreview(wrap); if (typeof updateLineNumbers === 'function') updateLineNumbers(); }
    updateUndoRedoBtns();
  }
  function editorRedo() {
    if (State.editorHistoryIndex >= State.editorHistory.length - 1) return;
    State.editorHistoryIndex++;
    const ta = wrap.querySelector('textarea.code-editor');
    if (ta) { ta.value = State.editorHistory[State.editorHistoryIndex]; State.editorDirty = true; updateEditorStatus(wrap); updatePreview(wrap); if (typeof updateLineNumbers === 'function') updateLineNumbers(); }
    updateUndoRedoBtns();
  }
  const undoBtn = el('button', { className: 'btn btn-ghost btn-sm', title: 'Undo (Ctrl+Z)', onClick: editorUndo });
  undoBtn.textContent = 'Undo';
  const redoBtn = el('button', { className: 'btn btn-ghost btn-sm', title: 'Redo (Ctrl+Shift+Z)', onClick: editorRedo });
  redoBtn.textContent = 'Redo';
  function updateUndoRedoBtns() {
    undoBtn.disabled = State.editorHistoryIndex <= 0;
    redoBtn.disabled = State.editorHistoryIndex >= State.editorHistory.length - 1;
    undoBtn.style.opacity = undoBtn.disabled ? '0.4' : '1';
    redoBtn.style.opacity = redoBtn.disabled ? '0.4' : '1';
  }
  updateUndoRedoBtns();

  const saveBtn = el('button', { className: 'btn btn-primary btn-sm', onClick: async () => {
    const ta = wrap.querySelector('textarea.code-editor');
    if (ta) await saveSkillContent(skill, ta.value);
    updateEditorStatus(wrap);
    updatePreview(wrap);
  } });
  saveBtn.innerHTML = `${icon('check', 14)} Save`;
  const backBtn = el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { if (State.editorDirty && !confirm('You have unsaved changes. Discard and go back to Library?')) return; State.editorDirty = false; State.view = 'dashboard'; render(); } });
  backBtn.textContent = 'Back to Library';
  toolbar.append(backBtn, insertFm, insertCode, undoBtn, redoBtn, saveBtn);
  wrap.appendChild(toolbar);

  // Editor + Preview
  const container = el('div', { className: 'editor-container', style: { flex: '1' } });

  // Left pane — editor
  const leftPane = el('div', { className: 'editor-pane' });
  leftPane.appendChild(el('div', { className: 'editor-pane-header', textContent: 'Source' }));
  const textarea = el('textarea', { className: 'code-editor',
    value: skill.rawContent,
    spellcheck: 'true',
    'aria-label': 'Skill source editor',
    onInput: () => { State.editorDirty = true; updateEditorStatus(wrap); updatePreview(wrap); updateLineNumbers(); pushHistory(textarea.value); },
    onKeydown: (e) => {
      // Tab support
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = textarea.selectionStart;
        textarea.value = textarea.value.slice(0, start) + '  ' + textarea.value.slice(textarea.selectionEnd);
        textarea.selectionStart = textarea.selectionEnd = start + 2;
      }
      // Ctrl+S save
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveBtn.click();
      }
      // Undo: Ctrl+Z
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        editorUndo();
      }
      // Redo: Ctrl+Shift+Z or Ctrl+Y
      if ((e.ctrlKey || e.metaKey) && (e.key === 'Z' || (e.key === 'z' && e.shiftKey) || e.key === 'y')) {
        e.preventDefault();
        editorRedo();
      }
    },
  });

  // Line numbers gutter
  const lineNumDiv = el('div', { className: 'line-numbers' });
  const editorWithLines = el('div', { className: 'editor-with-lines' });
  function updateLineNumbers() {
    const count = textarea.value.split('\n').length;
    lineNumDiv.textContent = Array.from({ length: count }, (_, i) => i + 1).join('\n');
  }
  updateLineNumbers();
  textarea.addEventListener('scroll', () => { lineNumDiv.scrollTop = textarea.scrollTop; });
  editorWithLines.append(lineNumDiv, textarea);
  leftPane.appendChild(editorWithLines);
  container.appendChild(leftPane);

  // Divider
  container.appendChild(el('div', { className: 'editor-divider' }));

  // Right pane — preview
  const rightPane = el('div', { className: 'editor-pane' });
  rightPane.appendChild(el('div', { className: 'editor-pane-header', textContent: 'Preview' }));
  const preview = el('div', { className: 'preview-pane' });
  const { body } = parseFrontmatter(skill.rawContent);
  preview.innerHTML = MD.render(body);

  const sfContent = el('div', { className: 'sf-panel-content', style: { display: 'none', padding: '12px 16px', maxHeight: '250px', overflowY: 'auto' } });

  // Quick action buttons
  const quickActions = el('div', { style: { display: 'flex', gap: '8px', marginBottom: '12px', flexWrap: 'wrap' } });
  const makeQuickBtn = (label, subdir) => {
    const btn = el('button', { className: 'btn btn-secondary btn-sm', 'aria-label': 'Create new file in ' + subdir,
      onClick: () => {

        const ta = el('textarea', { className: 'form-textarea', style: { minHeight: '100px', fontFamily: 'var(--mono)', fontSize: '12px' }, placeholder: 'File contents...', 'aria-label': 'Content for ' + filename });
        editorArea.appendChild(ta);
        const row = el('div', { style: { display: 'flex', gap: '8px', marginTop: '8px' } });
        row.appendChild(el('button', { className: 'btn btn-primary btn-sm', textContent: 'Save',
          onClick: async () => {
            if (await writeSupportingFile(skill, subdir, filename.trim(), ta.value)) {
              editorArea.remove();
              await loadSkills();

        row.appendChild(el('button', { className: 'btn btn-ghost btn-sm', textContent: 'Cancel', onClick: () => editorArea.remove() }));

  const makeUploadBtn = (label, subdir) => {
    const fileInput = el('input', { type: 'file', multiple: 'true', style: { display: 'none' } });
    fileInput.addEventListener('change', async () => {

  quickActions.append(

    makeQuickBtn('Reference', 'references'), makeUploadBtn('Reference', 'references'),
    makeQuickBtn('Asset', 'assets'), makeUploadBtn('Asset', 'assets')
  );
  sfContent.appendChild(quickActions);

  // Tree view of supporting files
  const sfTree = el('div', { className: 'sf-tree' });
  SUBDIRS.forEach(subdir => {
    const dirRow = el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px', padding: '4px 0', fontWeight: '600', fontSize: '13px' } });
    dirRow.innerHTML = icon('folder', 14);

    filesList.appendChild(el('span', { textContent: 'Scanning...', style: { fontSize: '11px', color: 'var(--text-muted)' } }));
    sfTree.appendChild(filesList);

    (async () => {
      try {

                ed.appendChild(edHeader);

      } catch (e) {

      }
    })();
  });
  sfContent.appendChild(sfTree);
  sfPanel.appendChild(sfContent);
  wrap.appendChild(sfPanel);

  // Status bar
  const statusBar = el('div', { className: 'editor-status' });
  const lines = skill.rawContent.split('\n').length;
  const tokens = countTokens(skill.rawContent);
  statusBar.innerHTML = `<span class="status-dot saved"></span> Saved · ${lines} lines · ~${tokens} tokens`;
  wrap.appendChild(statusBar);

  return wrap;
}

function updatePreview(wrap) {
  const ta = wrap.querySelector('textarea.code-editor');
  const preview = wrap.querySelector('.preview-pane');
  if (ta && preview) {
    const { body } = parseFrontmatter(ta.value);
    preview.innerHTML = MD.render(body);
  }
}

function updateEditorStatus(wrap) {
  const statusBar = wrap.querySelector('.editor-status');
  if (!statusBar) return;
  const ta = wrap.querySelector('textarea.code-editor');
  if (!ta) return;
  const lines = ta.value.split('\n').length;
  const tokens = countTokens(ta.value);
  const dotClass = State.editorDirty ? 'unsaved' : 'saved';
  const statusText = State.editorDirty ? 'Unsaved changes' : 'Saved';
  statusBar.innerHTML = `<span class="status-dot ${dotClass}"></span> ${statusText} · ${lines} lines · ~${tokens} tokens`;
}

function renderCollections() {
  const wrap = el('div', { className: 'slide-up' });
  wrap.appendChild(el('h2', { textContent: 'Collections', style: { marginBottom: '8px', fontSize: '22px' } }));
  wrap.appendChild(el('p', { textContent: 'Group skills into named collections for easy organization and export.', style: { color: 'var(--text-muted)', marginBottom: '20px' } }));

  // Create collection
  const createRow = el('div', { style: { display: 'flex', gap: '8px', marginBottom: '24px' } });
  const nameInput = el('input', { className: 'form-input', type: 'text', placeholder: 'New collection name', style: { flex: '1' } });
  const addBtn = el('button', { className: 'btn btn-primary', textContent: 'Create', onClick: async () => {
    const name = nameInput.value.trim();
    if (!name) return;
    State.collections.push({ name, skills: [] });
    await saveCollections();
    nameInput.value = '';

  } });
  createRow.append(nameInput, addBtn);
  wrap.appendChild(createRow);

  // List collections
  if (State.collections.length === 0) {
    wrap.appendChild(el('p', { textContent: 'No collections yet.', style: { color: 'var(--text-muted)' } }));
  } else {
    State.collections.forEach((col, ci) => {
      const card = el('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', padding: '16px', marginBottom: '12px' } });
      const header = el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' } });
      header.appendChild(el('h3', { textContent: col.name, style: { flex: '1', fontSize: '16px' } }));
      header.appendChild(el('span', { textContent: `${col.skills.length} skills`, style: { fontSize: '13px', color: 'var(--text-muted)' } }));
      // Export collection
      const expBtn = el('button', { className: 'btn btn-ghost btn-sm', onClick: () => {
        const enc = new TextEncoder();
        const files = [];
        col.skills.forEach(name => {
          const s = State.skills.find(sk => sk.dirName === name);
          if (s) files.push({ name: `${s.dirName}/SKILL.md`, data: enc.encode(s.rawContent) });
        });
        if (files.length === 0) { toast('No skills to export', 'error'); return; }
        const zip = ZIP.create(files);
        downloadBlob(new Blob([zip], { type: 'application/zip' }), `${col.name}.zip`);
      } });
      expBtn.innerHTML = icon('download', 14);
      header.appendChild(expBtn);
      // Delete collection
      const delBtn = el('button', { className: 'btn btn-ghost btn-sm', onClick: async () => {
        State.collections.splice(ci, 1);
        await saveCollections();
        renderContent();
      } });
      delBtn.innerHTML = icon('trash', 14);
      header.appendChild(delBtn);
      card.appendChild(header);

      // Skill tags
      const tagsDiv = el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '10px' } });
      col.skills.forEach((sName, si) => {
        const tag = el('span', { className: 'collection-tag' });
        tag.textContent = sName;
        const removeSpan = el('span', { className: 'remove', textContent: '×', role: 'button', 'aria-label': 'Remove ' + sName + ' from collection', onClick: async (e) => {
          e.stopPropagation();
          col.skills.splice(si, 1);
          await saveCollections();
          renderContent();
        } });
        tag.appendChild(removeSpan);
        tagsDiv.appendChild(tag);
      });
      card.appendChild(tagsDiv);

      // Add skill to collection
      const addSelect = el('select', { className: 'form-select', style: { fontSize: '13px' },

          if (e.target.value) {

            renderContent();
          }
        }
      });
      addSelect.appendChild(el('option', { value: '', textContent: '+ Add skill...' }));
      State.skills.filter(s => !col.skills.includes(s.dirName)).forEach(s => {
        addSelect.appendChild(el('option', { value: s.dirName, textContent: s.dirName }));
      });
      card.appendChild(addSelect);
      wrap.appendChild(card);
    });
  }
  return wrap;
}

// ─── Cross-Agent Sync (F-15) ────────────────────────────────────
async function loadSkillsFromHandle(dirHandle) {
  const skills = [];
  try {
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'directory' || entry.name.startsWith('.')) continue;
      try {
        const skillDir = await dirHandle.getDirectoryHandle(entry.name);
        const fileHandle = await skillDir.getFileHandle('SKILL.md');
        const file = await fileHandle.getFile();
        const content = await file.text();
        const { frontmatter, body } = parseFrontmatter(content);
        skills.push({
          dirName: entry.name,
          dirHandle: skillDir,
          parentHandle: dirHandle,
          fileHandle,
          frontmatter,
          body,
          rawContent: content,
          lineCount: content.split('\n').length,
        });
      } catch (e) { /* skip dirs without SKILL.md */ }
    }
  } catch (e) { /* ignore read errors */ }
  return skills;
}

async function copySkillToPrimary(skill) {
  try {
    const newDir = await State.dirHandle.getDirectoryHandle(skill.dirName, { create: true });
    const fileHandle = await newDir.getFileHandle('SKILL.md', { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(skill.rawContent);
    await writable.close();
    await loadSkills();
    toast('Copied: ' + skill.dirName);
  } catch (e) {
    toast('Copy failed: ' + e.message, 'error');
  }
}

async function copySkillToFolder(skill, targetHandle) {
  try {
    const newDir = await targetHandle.getDirectoryHandle(skill.dirName, { create: true });
    const fileHandle = await newDir.getFileHandle('SKILL.md', { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(skill.rawContent);
    await writable.close();
    toast('Copied: ' + skill.dirName);
  } catch (e) {
    toast('Copy failed: ' + e.message, 'error');
  }
}

function renderSyncDiffView(primarySkill, secondarySkill, folder) {
  const container = el('div', { className: 'sync-diff-view' });
  const pLines = primarySkill.lineCount;
  const sLines = secondarySkill.lineCount;
  const delta = Math.abs(pLines - sLines);
  container.appendChild(el('div', { className: 'sync-diff-summary', textContent: `Primary: ${pLines} lines | Secondary: ${sLines} lines | \u0394${delta} lines` }));
  const leftPanel = el('div', { className: 'sync-diff-panel' });
  leftPanel.appendChild(el('h5', { textContent: 'Primary (' + (State.dirHandle?.name || 'primary') + ')' }));
  leftPanel.appendChild(el('pre', { textContent: primarySkill.rawContent, style: { margin: '0', whiteSpace: 'pre-wrap', fontFamily: 'inherit', fontSize: 'inherit' } }));
  container.appendChild(leftPanel);
  const rightPanel = el('div', { className: 'sync-diff-panel' });
  rightPanel.appendChild(el('h5', { textContent: 'Secondary (' + folder.name + ')' }));
  rightPanel.appendChild(el('pre', { textContent: secondarySkill.rawContent, style: { margin: '0', whiteSpace: 'pre-wrap', fontFamily: 'inherit', fontSize: 'inherit' } }));
  container.appendChild(rightPanel);
  const actions = el('div', { className: 'sync-diff-actions' });
  const usePrimaryBtn = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
    await copySkillToFolder(primarySkill, folder.handle);
    folder.skills = await loadSkillsFromHandle(folder.handle);
    renderContent();
  } });
  usePrimaryBtn.textContent = '\u2190 Use Primary';
  const useSecondaryBtn = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
    await copySkillToPrimary(secondarySkill);
    folder.skills = await loadSkillsFromHandle(folder.handle);
    renderContent();
  } });
  useSecondaryBtn.textContent = 'Use Secondary \u2192';
  actions.appendChild(usePrimaryBtn);
  actions.appendChild(useSecondaryBtn);
  container.appendChild(actions);
  return container;
}

function renderSync() {
  const wrap = el('div', { className: 'slide-up' });
  wrap.appendChild(el('h2', { textContent: 'Cross-Agent Sync', style: { marginBottom: '8px', fontSize: '22px' } }));
  wrap.appendChild(el('p', { textContent: 'Open multiple agent skill folders to compare and sync skills between them.', style: { color: 'var(--text-muted)', marginBottom: '20px' } }));

  // Edge case: no primary folder
  if (!State.dirHandle) {
    wrap.appendChild(el('p', { textContent: 'Open a skills folder first from the welcome screen.', style: { color: 'var(--warn, #f59e0b)', fontStyle: 'italic' } }));
    return wrap;
  }

  // Current folder
  const currentDiv = el('div', { className: 'folder-item', style: { marginBottom: '16px' } });
  currentDiv.appendChild(el('span', { style: { fontWeight: '600', fontSize: '14px' }, textContent: 'Primary Folder' }));
  currentDiv.appendChild(el('span', { className: 'folder-path', textContent: State.dirHandle.name }));
  currentDiv.appendChild(el('span', { className: 'folder-count', textContent: State.skills.length + ' skills' }));
  wrap.appendChild(currentDiv);

  // Additional folders list with remove buttons
  if (State.additionalFolders.length > 0) {
    State.additionalFolders.forEach((folder, fi) => {
      const item = el('div', { className: 'folder-item', style: { marginBottom: '8px' } });
      item.appendChild(el('span', { className: 'folder-path', textContent: folder.name }));
      item.appendChild(el('span', { className: 'folder-count', textContent: folder.skills.length + ' skills' }));
      const removeBtn = el('button', { className: 'sync-remove-btn', title: 'Remove folder', onClick: () => {
        State.additionalFolders.splice(fi, 1);
        renderContent();
      } });
      removeBtn.textContent = '\u2715';
      item.appendChild(removeBtn);
      wrap.appendChild(item);
    });
  }

  // Add folder button
  const addBtn = el('button', { className: 'btn btn-secondary', style: { marginTop: '8px' }, onClick: async () => {
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      // Edge case: same folder as primary
      if (handle.name === State.dirHandle.name) {
        try {
          const isSame = await State.dirHandle.isSameEntry(handle);
          if (isSame) {
            toast('This is the same folder as your primary', 'error');
            return;
          }
        } catch (e) { /* isSameEntry not supported, allow it */ }
      }
      // Show loading
      const loadingEl = el('div', { className: 'sync-loading', textContent: 'Scanning folder\u2026' });
      wrap.appendChild(loadingEl);
      const skills = await loadSkillsFromHandle(handle);
      if (loadingEl.parentNode) loadingEl.remove();
      if (skills.length === 0) {
        toast('No skills found in ' + handle.name, 'error');
        return;
      }
      State.additionalFolders.push({ handle, name: handle.name, skills });
      renderContent();
    } catch (e) {
      if (e.name !== 'AbortError') toast('Failed to open folder', 'error');
    }
  } });
  addBtn.innerHTML = `${icon('folder')} Add Agent Folder`;
  wrap.appendChild(addBtn);

  // Comparison view for each additional folder
  State.additionalFolders.forEach((folder) => {
    const primaryNames = new Set(State.skills.map(s => s.dirName));
    const secondaryNames = new Set(folder.skills.map(s => s.dirName));
    const onlyPrimary = State.skills.filter(s => !secondaryNames.has(s.dirName));
    const onlySecondary = folder.skills.filter(s => !primaryNames.has(s.dirName));
    const shared = State.skills.filter(s => secondaryNames.has(s.dirName)).map(ps => {
      const ss = folder.skills.find(s => s.dirName === ps.dirName);
      return { dirName: ps.dirName, primary: ps, secondary: ss, same: ps.rawContent === ss.rawContent };
    });
    const diffCount = shared.filter(s => !s.same).length;

    // Summary stats bar
    const stats = el('div', { className: 'sync-stats', style: { marginTop: '24px' } });
    stats.appendChild(el('span', { textContent: `${onlyPrimary.length} only in Primary` }));

    stats.appendChild(el('span', { textContent: `${shared.length} shared${diffCount > 0 ? ' (' + diffCount + ' differ)' : ''}` }));
    stats.appendChild(el('span', { textContent: '\u00B7' }));
    stats.appendChild(el('span', { textContent: `${onlySecondary.length} only in ${folder.name}` }));
    wrap.appendChild(stats);

    // Three-column grid
    const grid = el('div', { className: 'sync-grid' });

    // Column 1: Only in Primary
    const col1 = el('div', { className: 'sync-column' });
    col1.appendChild(el('h4', { textContent: 'Only in Primary' }));
    if (onlyPrimary.length === 0) {
      col1.appendChild(el('div', { textContent: 'None', style: { fontSize: '13px', color: 'var(--text-muted)', fontStyle: 'italic' } }));

        row.appendChild(el('span', { className: 'skill-name', textContent: skill.dirName }));
        const copyBtn = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
          await copySkillToFolder(skill, folder.handle);
          folder.skills = await loadSkillsFromHandle(folder.handle);

        } });
        copyBtn.textContent = 'Copy \u2192';
        row.appendChild(copyBtn);
        col1.appendChild(row);
      });
      const bulk1 = el('div', { className: 'sync-bulk' });
      const copyAllRight = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
        for (const skill of onlyPrimary) await copySkillToFolder(skill, folder.handle);
        folder.skills = await loadSkillsFromHandle(folder.handle);
        renderContent();
        toast(`Copied ${onlyPrimary.length} skills to ${folder.name}`);
      } });
      copyAllRight.textContent = `Copy All (${onlyPrimary.length}) \u2192`;
      bulk1.appendChild(copyAllRight);
      col1.appendChild(bulk1);
    }
    grid.appendChild(col1);

    // Column 2: In Both
    const col2 = el('div', { className: 'sync-column' });
    col2.appendChild(el('h4', { textContent: 'In Both' }));
    if (shared.length === 0) {
      col2.appendChild(el('div', { textContent: 'None', style: { fontSize: '13px', color: 'var(--text-muted)', fontStyle: 'italic' } }));
    } else {
      shared.forEach(item => {
        const row = el('div', { className: 'sync-skill' });
        row.appendChild(el('span', { className: 'skill-name', textContent: item.dirName }));
        if (item.same) {
          row.appendChild(el('span', { className: 'sync-status-same', textContent: '\u2713 Same' }));
        } else {
          const diffBtn = el('span', { className: 'sync-status-diff', onClick: () => {
            // Toggle diff view
            const existing = row.nextElementSibling;
            if (existing && existing.classList.contains('sync-diff-view')) {
              existing.remove();
            } else {
              const diffView = renderSyncDiffView(item.primary, item.secondary, folder);
              row.after(diffView);
            }
          } });
          diffBtn.textContent = '\u2260 Different';
          row.appendChild(diffBtn);
        }
        col2.appendChild(row);
      });
    }
    grid.appendChild(col2);

    // Column 3: Only in Secondary
    const col3 = el('div', { className: 'sync-column' });
    col3.appendChild(el('h4', { textContent: 'Only in ' + folder.name }));
    if (onlySecondary.length === 0) {
      col3.appendChild(el('div', { textContent: 'None', style: { fontSize: '13px', color: 'var(--text-muted)', fontStyle: 'italic' } }));
    } else {
      onlySecondary.forEach(skill => {
        const row = el('div', { className: 'sync-skill' });
        row.appendChild(el('span', { className: 'skill-name', textContent: skill.dirName }));
        const copyBtn = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
          await copySkillToPrimary(skill);
          folder.skills = await loadSkillsFromHandle(folder.handle);
          renderContent();
        } });
        copyBtn.textContent = '\u2190 Copy';
        row.appendChild(copyBtn);
        col3.appendChild(row);
      });
      const bulk3 = el('div', { className: 'sync-bulk' });
      const copyAllLeft = el('button', { className: 'btn btn-sm btn-secondary', onClick: async () => {
        for (const skill of onlySecondary) await copySkillToPrimary(skill);
        folder.skills = await loadSkillsFromHandle(folder.handle);
        renderContent();
        toast(`Copied ${onlySecondary.length} skills to primary`);
      } });
      copyAllLeft.textContent = `\u2190 Copy All (${onlySecondary.length})`;
      bulk3.appendChild(copyAllLeft);
      col3.appendChild(bulk3);
    }
    grid.appendChild(col3);

    wrap.appendChild(grid);
  });

  return wrap;
}

// ─── MCP Server Page ─────────────────────────────────────────────
function generateMcpServerScript() {
  const port = localStorage.getItem('sf-mcp-port') || '3000';
  const token = localStorage.getItem('sf-mcp-token') || '';
  const ops = JSON.parse(localStorage.getItem('sf-mcp-ops') || '["read","write","delete","search"]');
  const skillsPath = State.dirHandle ? State.dirHandle.name : '~/.claude/skills';

  return `#!/usr/bin/env node
// SkillForge MCP Server — generated by SkillForge
// Install: npm install @modelcontextprotocol/sdk js-yaml
// Run:     node skillforge-mcp-server.js
//
// Generated: ${new Date().toISOString()}

const { Server } = require('@modelcontextprotocol/sdk/server/index.js');
const { StdioServerTransport } = require('@modelcontextprotocol/sdk/server/stdio.js');
const { CallToolRequestSchema, ListToolsRequestSchema } = require('@modelcontextprotocol/sdk/types.js');
const fs = require('fs');
const path = require('path');

// ─── Configuration ───────────────────────────────────────────────
const SKILLS_DIR = process.env.SKILLS_DIR || path.resolve(process.env.HOME || '~', '${esc(skillsPath)}');
const AUTH_TOKEN = process.env.MCP_AUTH_TOKEN || ${JSON.stringify(token)};
const ALLOWED_OPS = new Set(${JSON.stringify(ops)});

// ─── Helpers ─────────────────────────────────────────────────────
function parseFrontmatter(content) {
  const match = content.match(/^---\\n([\\s\\S]*?)\\n---\\n?([\\s\\S]*)$/);
  if (!match) return { frontmatter: {}, body: content };
  try {
    // Simple YAML parse for key: value pairs
    const fm = {};
    match[1].split('\\n').forEach(line => {
      const kv = line.match(/^(\\S+):\\s*(.*)/);
      if (kv) fm[kv[1]] = kv[2].replace(/^["']|["']$/g, '').trim();
    });
    return { frontmatter: fm, body: match[2] };
  } catch (e) { return { frontmatter: {}, body: content }; }
}

function readSkill(dirName) {
  const skillDir = path.join(SKILLS_DIR, dirName);
  const skillFile = path.join(skillDir, 'SKILL.md');
  if (!fs.existsSync(skillFile)) return null;
  const content = fs.readFileSync(skillFile, 'utf-8');
  const { frontmatter, body } = parseFrontmatter(content);
  return { dirName, frontmatter, body, rawContent: content };
}

function listSkills() {
  if (!fs.existsSync(SKILLS_DIR)) return [];
  return fs.readdirSync(SKILLS_DIR, { withFileTypes: true })
    .filter(d => d.isDirectory() && !d.name.startsWith('.'))
    .map(d => readSkill(d.name))
    .filter(Boolean);
}

function validateSkillContent(content) {
  const issues = [];
  const { frontmatter } = parseFrontmatter(content);
  if (!frontmatter.name) issues.push({ type: 'error', msg: 'Missing required field: name' });
  if (!frontmatter.description) issues.push({ type: 'error', msg: 'Missing required field: description' });
  if (content.split('\\n').length > 500) issues.push({ type: 'warn', msg: 'Exceeds 500 lines' });
  return issues;
}

// ─── MCP Server Setup ────────────────────────────────────────────
const server = new Server({ name: 'skillforge', version: '2.0.0' }, {
  capabilities: { tools: {} }
});

// List available tools
server.setRequestHandler(ListToolsRequestSchema, async () => {
  const tools = [];
  if (ALLOWED_OPS.has('read')) {
    tools.push(
      { name: 'list_skills', description: 'List all skills in the library', inputSchema: { type: 'object', properties: {} } },
      { name: 'get_skill', description: 'Get a skill by directory name', inputSchema: { type: 'object', properties: { name: { type: 'string', description: 'Skill directory name' } }, required: ['name'] } },
      { name: 'search_skills', description: 'Search skills by query', inputSchema: { type: 'object', properties: { query: { type: 'string', description: 'Search query' } }, required: ['query'] } }
    );
  }
  if (ALLOWED_OPS.has('write')) {
    tools.push(
      { name: 'create_skill', description: 'Create a new skill', inputSchema: { type: 'object', properties: { name: { type: 'string', description: 'Skill directory name (lowercase, hyphens)' }, content: { type: 'string', description: 'Full SKILL.md content with frontmatter' } }, required: ['name', 'content'] } },
      { name: 'update_skill', description: 'Update an existing skill', inputSchema: { type: 'object', properties: { name: { type: 'string', description: 'Skill directory name' }, content: { type: 'string', description: 'Updated SKILL.md content' } }, required: ['name', 'content'] } }
    );
  }
  if (ALLOWED_OPS.has('delete')) {
    tools.push(
      { name: 'delete_skill', description: 'Delete a skill', inputSchema: { type: 'object', properties: { name: { type: 'string', description: 'Skill directory name' } }, required: ['name'] } }
    );
  }
  if (ALLOWED_OPS.has('read')) {
    tools.push(
      { name: 'validate_skill', description: 'Validate a skill against the spec', inputSchema: { type: 'object', properties: { content: { type: 'string', description: 'SKILL.md content to validate' } }, required: ['content'] } }
    );
  }
  return { tools };
});

// Handle tool calls
server.setRequestHandler(CallToolRequestSchema, async (request) => {
  const { name: toolName, arguments: args } = request.params;

  switch (toolName) {
    case 'list_skills': {
      const skills = listSkills().map(s => ({ name: s.dirName, description: s.frontmatter.description || '' }));
      return { content: [{ type: 'text', text: JSON.stringify(skills, null, 2) }] };
    }
    case 'get_skill': {
      const skill = readSkill(args.name);
      if (!skill) return { content: [{ type: 'text', text: 'Skill not found: ' + args.name }], isError: true };
      return { content: [{ type: 'text', text: skill.rawContent }] };
    }
    case 'search_skills': {
      const q = (args.query || '').toLowerCase();
      const results = listSkills().filter(s =>
        s.dirName.toLowerCase().includes(q) ||
        (s.frontmatter.name || '').toLowerCase().includes(q) ||
        (s.frontmatter.description || '').toLowerCase().includes(q) ||
        s.body.toLowerCase().includes(q)
      ).map(s => ({ name: s.dirName, description: s.frontmatter.description || '' }));
      return { content: [{ type: 'text', text: JSON.stringify(results, null, 2) }] };
    }
    case 'create_skill': {
      const safeName = args.name.replace(/[^a-z0-9-]/g, '');
      const dir = path.join(SKILLS_DIR, safeName);
      if (fs.existsSync(dir)) return { content: [{ type: 'text', text: 'Skill already exists: ' + safeName }], isError: true };
      fs.mkdirSync(dir, { recursive: true });
      fs.writeFileSync(path.join(dir, 'SKILL.md'), args.content, 'utf-8');
      return { content: [{ type: 'text', text: 'Created skill: ' + safeName }] };
    }
    case 'update_skill': {
      const skillPath = path.join(SKILLS_DIR, args.name, 'SKILL.md');
      if (!fs.existsSync(skillPath)) return { content: [{ type: 'text', text: 'Skill not found: ' + args.name }], isError: true };
      fs.writeFileSync(skillPath, args.content, 'utf-8');
      return { content: [{ type: 'text', text: 'Updated skill: ' + args.name }] };
    }
    case 'delete_skill': {
      const delDir = path.join(SKILLS_DIR, args.name);
      if (!fs.existsSync(delDir)) return { content: [{ type: 'text', text: 'Skill not found: ' + args.name }], isError: true };
      fs.rmSync(delDir, { recursive: true });
      return { content: [{ type: 'text', text: 'Deleted skill: ' + args.name }] };
    }
    case 'validate_skill': {
      const issues = validateSkillContent(args.content);
      return { content: [{ type: 'text', text: JSON.stringify({ valid: issues.filter(i => i.type === 'error').length === 0, issues }, null, 2) }] };
    }
    default:
      return { content: [{ type: 'text', text: 'Unknown tool: ' + toolName }], isError: true };
  }
});

// Start server
async function main() {
  const transport = new StdioServerTransport();
  console.error('SkillForge MCP Server starting...');
  console.error('Skills directory: ' + SKILLS_DIR);
  console.error('Allowed operations: ' + [...ALLOWED_OPS].join(', '));
  await server.connect(transport);
  console.error('SkillForge MCP Server running on stdio');
}

main().catch((err) => { console.error('Failed to start:', err); process.exit(1); });
`;
}

  downloadBlob(blob, 'skillforge-mcp-server.js');

}

  wrap.appendChild(el('p', { textContent: 'These tools are exposed by the generated MCP server:', style: { color: 'var(--text-muted)', marginBottom: '12px', fontSize: '13px' } }));

  const endpoints = [
    { method: 'READ', path: 'list_skills', desc: 'List all skills' },
    { method: 'READ', path: 'get_skill', desc: 'Get skill details by name' },
    { method: 'WRITE', path: 'create_skill', desc: 'Create a new skill' },
    { method: 'WRITE', path: 'update_skill', desc: 'Update a skill' },
    { method: 'DELETE', path: 'delete_skill', desc: 'Delete a skill' },
    { method: 'READ', path: 'search_skills', desc: 'Search skills by query' },
    { method: 'READ', path: 'validate_skill', desc: 'Validate skill content' },
  ];

  const endpointTable = el('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', overflow: 'hidden', marginBottom: '24px' } });
  endpoints.forEach((ep, i) => {
    const methodColors = { READ: 'var(--success)', WRITE: 'var(--accent)', DELETE: 'var(--error)' };
    const row = el('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 16px', fontSize: '13px', borderBottom: i < endpoints.length - 1 ? '1px solid var(--border)' : 'none', background: i % 2 === 0 ? 'var(--bg-card)' : 'var(--bg-alt)' } });
    row.appendChild(el('span', { textContent: ep.method, style: { fontWeight: '700', fontSize: '11px', width: '56px', textAlign: 'center', color: methodColors[ep.method] || 'var(--text)', padding: '2px 8px', borderRadius: '4px', border: '1px solid ' + (methodColors[ep.method] || 'var(--border)'), flexShrink: '0' } }));
    row.appendChild(el('code', { textContent: ep.path, style: { fontFamily: 'var(--mono)', fontSize: '13px', flex: '1' } }));
    row.appendChild(el('span', { textContent: ep.desc, style: { color: 'var(--text-muted)', fontSize: '12px', flexShrink: '0' } }));
    endpointTable.appendChild(row);
  });
  wrap.appendChild(endpointTable);

  // CLAUDE.md vs Skills guidance card (CA-03)
  const guidanceCard = el('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', marginBottom: '24px', background: 'var(--bg-card)', overflow: 'hidden' } });
  const guidanceToggle = el('button', {
    style: { width: '100%', display: 'flex', alignItems: 'center', gap: '10px', padding: '14px 18px', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-heading)', fontSize: '14px', fontWeight: '600', textAlign: 'left' },
    onClick: () => {
      const body = guidanceCard.querySelector('.guidance-body');
      const chevron = guidanceToggle.querySelector('.guidance-chevron');
      if (body.style.display === 'none') {
        body.style.display = 'block';
        chevron.style.transform = 'rotate(90deg)';
      } else {
        body.style.display = 'none';
        chevron.style.transform = 'rotate(0deg)';
      }
    }
  });
  guidanceToggle.innerHTML = `<span style="font-size:18px">💡</span><span style="flex:1">When to use CLAUDE.md vs Skills</span><span class="guidance-chevron" style="transition:transform .2s;transform:rotate(0deg);color:var(--text-muted)">${ICONS.chevronRight}</span>`;
  guidanceCard.appendChild(guidanceToggle);

  const guidanceBody = el('div', { className: 'guidance-body', style: { display: 'none', padding: '0 18px 18px', fontSize: '13px', lineHeight: '1.7', color: 'var(--text)' } });
  guidanceBody.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">
      <div style="background:var(--bg-alt);border-radius:var(--radius);padding:14px">
        <div style="font-weight:600;margin-bottom:8px;color:var(--text-heading)">📄 CLAUDE.md</div>
        <ul style="padding-left:18px;margin:0;color:var(--text-muted)">
          <li>Project-specific context that should always be available</li>
          <li>Coding conventions, tech stack versions, project structure</li>
          <li>Vercel research shows <strong style="color:var(--success)">100% success rate</strong> — agent reads it automatically</li>
        </ul>
      </div>
      <div style="background:var(--bg-alt);border-radius:var(--radius);padding:14px">
        <div style="font-weight:600;margin-bottom:8px;color:var(--text-heading)">⚡ Skills</div>
        <ul style="padding-left:18px;margin:0;color:var(--text-muted)">
          <li>Reusable instructions across multiple projects</li>
          <li>Shareable with team members or the community</li>
          <li>Modular capabilities (code review, docs, etc.)</li>
          <li>Can be activated on-demand for specific tasks</li>
        </ul>
      </div>
    </div>
    <div style="background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--accent)">
      <strong>Pro tip:</strong> Use CLAUDE.md for project context, Skills for reusable workflows. Vercel's research found CLAUDE.md had a 100% success rate vs 56% without it.
    </div>
  `;
  guidanceCard.appendChild(guidanceBody);
  wrap.appendChild(guidanceCard);

  return wrap;
}

// ─── Marketplace Placeholder (F-12) ──────────────────────────────
function renderMarketplace() {
  const wrap = el('div', { className: 'marketplace-placeholder slide-up' });
  wrap.appendChild(el('div', { className: 'empty-icon', style: { margin: '0 auto 20px', fontSize: '48px' }, textContent: '🏪' }));
  wrap.appendChild(el('h2', { textContent: 'Skill Marketplace' }));
  wrap.appendChild(el('p', { style: { marginTop: '8px' }, textContent: 'Browse and install community skills from agentskills.io and GitHub. Coming soon in a future update.' }));
  return wrap;
}

// ─── Keyboard Shortcuts ──────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Ctrl+K → focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    const input = $('.search-box input');
    if (input) input.focus();
  }
  // Ctrl+N → new skill
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'N') {
    e.preventDefault();
    if (State.view === 'editor' && State.editorDirty && !confirm('You have unsaved changes. Discard?')) return;
    State.editorDirty = false; State.view = 'wizard'; State.wizardStep = 0; State.wizardData = {};
    render();
  }
  // Escape → close panel
  if (e.key === 'Escape') {
    closePanel();
    const overlay = $('.modal-overlay.open');
    if (overlay) overlay.classList.remove('open');
  }
});

// ─── Init ────────────────────────────────────────────────────────
function init() {
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  document.body.innerHTML = '<div id="app"></div>';
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();

</script>
</body>
