name: ci

# CI runs on push to main and on PRs; workflow_dispatch retained for manual runs.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node 22, zero-install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Zero-install workspace resolution: junction/symlink packages/* into node_modules/@skillforge/*.
      # No `npm install` and no build step — the runtime is Node 22 native TypeScript type-stripping.
      - name: Link workspace
        run: node scripts/link-workspace.mjs

      # STRUCTURAL LINT (§2 / D24): @skillforge/core's leverage point stays child_process-free — the only
      # core module allowed to import node:child_process is core/src/exec (the audited spawn chokepoint).
      # This guards the invariant "our execution is never silent": every other spawn is an injected edge
      # capability (CloneFn / RegistryResolveFn) living in an adapter, never hidden inside pure core.
      - name: Lint — core stays child_process-free (outside exec)
        run: node scripts/lint-core-no-child-process.mjs

      # LEGAL LINT (fixtures attribution gate): the public Apache-2.0 repo must never ship a fixture skill whose
      # frontmatter license is "Proprietary" (e.g. Anthropic's docx/pdf/pptx/xlsx — redistribution forbidden) or
      # points at a LICENSE.txt that ships nowhere. The real terms live in /THIRD_PARTY_LICENSES.md (+ NOTICE /
      # ATTRIBUTIONS.md). This guard fails CI the moment such a fixture is reintroduced.
      - name: Lint — fixtures carry no proprietary/dangling license
        run: node scripts/lint-no-proprietary-fixtures.mjs

      # TYPE GATE (tsc --noEmit): the runtime never compiles (Node 22 type-stripping), so type-only
      # defects — an import that resolves to nothing, a structurally-wrong shape — RUN fine and the test
      # suite can't see them. tsc is the actor that observes that class. The TS deps live in an isolated
      # sidecar (scripts/typecheck/) because root `npm install` can't resolve the packages' `workspace:*`;
      # scripts/typecheck.mjs bootstraps it (npm ci from the committed lockfile) + the junctions, then runs tsc.
      - name: Type check (tsc --noEmit, src + tests)
        run: node scripts/typecheck.mjs

      # The whole suite, including: the golden PARITY harness (core.select == plugin embedded path, D5);
      # the DAEMON-path golden parity (daemon /route-test == plugin == core, incl. a partial-embedding case
      # and the float32-vs-float64 ordering proof, §8); the crash-restart proof (DB rebuild + staleness, §5);
      # and the negative-set false-fire ceiling. The semantic tier self-skips when LM Studio is absent (no
      # embeddings endpoint in CI). The live LM Studio injection-behavior check is a LOCAL pre-release step
      # with a pinned version (D18) — deliberately NOT a CI gate (no multi-GB model runs here).
      # --experimental-sqlite is REQUIRED: the Phase-2 daemon store (node:sqlite) and its whole suite
      # run under it (W1a+). --experimental-strip-types keeps the native-TS, zero-install runtime.
      # --test-concurrency=2 caps parallel test processes so the suite stays within the free-tier
      # Ubuntu runner's memory (the daemon suite spawns node:sqlite processes; an unbounded fan-out can
      # OOM a 2-core/7GB runner). Locally the same flag avoids a spawn-storm on memory-constrained boxes.
      - name: Run test suite
        run: node --experimental-strip-types --experimental-sqlite --test-concurrency=2 --test "packages/**/test/*.ts"
